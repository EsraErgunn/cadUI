<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40">
  <g fill="none" stroke="#1e293b" stroke-width="2">
    <!-- Yukarı çıkan çizgiler -->
    <line x1="40" y1="6" x2="40" y2="-70" />
    <line x1="20" y1="6" x2="20" y2="-70" />

    <!-- Gövde -->
    <rect x="14" y="6" width="32" height="25" />

    <!-- Sola kaydırılmış ve dikeyde ortalanmış vana -->
